name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза (например v1.0.0). Пусто — только сборка'
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build VidShow.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: VidShow
          path: out/VidShow.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/VidShow.exe
          generate_release_notes: true
          body: |
            ## Vid-show
            Двухэкранный видеоплеер: пульт на вашем экране, на проекторе — только видео.

            **Установка не нужна** — скачайте `VidShow.exe` и запустите.
            Работает на Windows 7 SP1 / 8 / 10 / 11 (нужен .NET Framework 4.8 — он уже встроен в Windows 10 1903+ и Windows 11).
            Если на слабом ПК/в виртуалке видео тормозит: `VidShow.exe --software`.
